<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tags</title>
    </head>
    <body style="background-color: pink">
        <h2>Registration From</h2>
        </form>
            <table>
                <tr>
                    <td>Roll No.</td>
                    <td>:</td>
                    <td><input type="text" placeholder="Enter Your Roll Number"></td>
                </tr>
                <tr>
                    <td>Student Name</td>
                    <td>:</td>
                    <td>
                        <input type="text" placeholder="Enter Your First Name"> - 
                        <input type="text" placeholder="Enter Your Last Name">
                    </td>
                </tr>
                <tr>
                    <td>Father's Name</td>
                    <td>:</td>
                    <td><input type="text" placeholder="Enter Your Father's Name"></td>
                </tr>
                <tr>
                    <td>Date of Birth</td>
                    <td>:</td>
                    <td>
                        <select>
                            <option>--Day--</option>
                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option>30</option>
                            <option>31</option>
                        </select> -
                        <select>
                            <option>--Month--</option>
                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option>11</option>
                            <option>12</option>
                        </select> -
                        <select>
                            <option>--Year--</option>
                            <option>2002</option>
                            <option>2003</option>
                            <option>2004</option>
                            <option>2005</option>
                            <option>2024</option>
                            <option>2025</option>
                            <option>2026</option>
                        </select>
                        (DD-MM-YYYY)
                    </td>
                </tr>
                <tr>
                    <td>Mobile</td>
                    <td>:</td>
                    <td>
                        <select>
                            <option>+91</option>
                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option>30</option>
                            <option>31</option>
                        </select> -
                        <input type="number" placeholder="Enter Your First Name"></td>
                </tr>
                <tr>
                    <td>Email</td>
                    <td>:</td>
                    <td><input type="email" placeholder="Enter Your Email id"></td>
                </tr>
                <tr>
                    <td>Password</td>
                    <td>:</td>
                    <td><input type="password" placeholder="Enter Your Password"></td>
                </tr>
                <tr>
                    <td>Gender</td>
                    <td>:</td>
                    <td>
                        <input type="radio">Male
                        <input type="radio">FeMale
                        <input type="radio">Other
                    </td>
                </tr>                
                <tr>
                    <td>Skills</td>
                    <td>:</td>
                    <td>
                        <input type="checkbox">HTML
                        <input type="checkbox">CSS
                        <input type="checkbox">Js
                    </td>
                </tr>                 
                <tr>
                    <td>Courese</td>
                    <td>:</td>
                    <td>
                        <select>
                            <option>--Select Current Course's--</option>
                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option>30</option>
                            <option>31</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Student Photos</td>
                    <td>:</td>
                    <td><input type="file"></td>
                </tr>
                <tr>
                    <td>City</td>
                    <td>:</td>
                    <td><input type="text" placeholder="Enter Your Email id"></td>
                </tr>
                <tr>
                    <td>A ddress</td>
                    <td>:</td>
                    <td><textarea></textarea></td>
                </tr>                
                <tr>
                    <td><button>Register</button></td>
                </tr>
            </table>        
    </body>
</html>
